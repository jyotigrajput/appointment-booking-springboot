<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
	<h1> Appointment list</h1>

    <form th:action="@{/appointments}" th:object="${appointment}" method="post" class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Customer</label>
            <select th:field="*{customer.id}" class="form-select" required>
                <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name}">Customer</option>
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label">When</label>
            <input type="datetime-local" th:field="*{appointmentTime}" class="form-control" required/>
        </div>

        <div class="col-12">
            <label class="form-label">Notes</label>
            <textarea th:field="*{notes}" class="form-control" rows="3"></textarea>
        </div>

        <div class="col-12">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-secondary" th:href="@{/appointments}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
