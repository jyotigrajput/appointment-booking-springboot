<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
    <h1>Appointments</h1>
    <a class="btn btn-primary mb-3" th:href="@{/appointments/new}">New Appointment</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>When</th>
            <th>Notes</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${appointments}">
            <td th:text="${a.id}">1</td>
            <td th:text="${a.customer.name}">Customer</td>
            <td th:text="${#temporals.format(a.appointmentTime, 'yyyy-MM-dd HH:mm')}">2026-01-01 10:00</td>
            <td th:text="${a.notes}">notes</td>
            <td>
                <a th:href="@{|/appointments/delete/${a.id}|}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Delete appointment?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
