name: CI

on:
 workflow_dispatch: {}

jobs:
   code-lint:
     runs-on: ubuntu-latest
     steps:
        - name: Clone the code
          uses: actions/checkout@v7

        - name : Setup java
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin' 
            
        - name : Run linter
          run : mvn checkstyle:check



   
